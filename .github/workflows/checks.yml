name: Checks
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ""
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sh scripts/check.sh
      - name: Verify module lockfiles
        env:
          GOWORK: 'off'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Fetch pinned host packager
        uses: actions/checkout@v4
        with:
          repository: zerodenet/zboard
          ref: a8fca1ba3fe667dc6157a64e682300155392bd29
          path: .local/host
          persist-credentials: false
      - name: Build and verify development packages
        env:
          BUILD_ALL_PLATFORMS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          platforms="linux-amd64"
          if [ "$BUILD_ALL_PLATFORMS" = 'true' ]; then
            platforms="linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64"
          fi
          for platform in $platforms; do
            python3 scripts/package.py --zboard .local/host --dev-key --platform "$platform"
          done
      - name: Prepare development artifact notes and checksums
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/development_artifacts.py
      - name: Upload development packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: oauth-development-${{ github.sha }}
          path: |
            dist/*.zbplugin
            dist/SHA256SUMS
            dist/README.md
            dist/oauth-local-dev.pub
          if-no-files-found: error
          retention-days: 14
