name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version, for example v0.0.2 (run from reviewed main or a release tag)'
        type: string
        required: true
        default: v0.0.2
  push:
    tags: ['v*']
    branches: ['release/v*']
permissions:
  contents: read
concurrency:
  group: oauth-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      source_ref: ${{ github.sha }}
  release:
    needs: checks
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release identity
        id: identity
        env:
          REQUESTED_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="${REQUESTED_VERSION#release/}"
          python3 scripts/release.py check --tag "$tag"
          git merge-base --is-ancestor HEAD origin/main
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$tag^{commit}")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Fetch pinned host packager
        uses: actions/checkout@v4
        with:
          repository: zerodenet/zboard
          ref: 96607bd84893be6fc355b5ebe12ff60b9eac86be
          path: .local/host
          persist-credentials: false
      - name: Prepare signing key
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
          PLUGIN_PUBLISHER_ID: ${{ vars.PLUGIN_PUBLISHER_ID || 'higanbana986' }}
          PLUGIN_PUBLIC_KEY: ${{ vars.PLUGIN_PUBLIC_KEY }}
        run: python3 scripts/release.py key --out "$RUNNER_TEMP/oauth-signing.key"
      - name: Build and verify platform packages
        env:
          PLUGIN_PUBLISHER_ID: ${{ vars.PLUGIN_PUBLISHER_ID || 'higanbana986' }}
        run: |
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            python3 scripts/package.py --zboard .local/host --platform "$platform" --key "$RUNNER_TEMP/oauth-signing.key" --key-id "$PLUGIN_PUBLISHER_ID"
          done
      - name: Generate release metadata
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          PLUGIN_PUBLISHER_ID: ${{ vars.PLUGIN_PUBLISHER_ID || 'higanbana986' }}
          PLUGIN_PUBLIC_KEY: ${{ vars.PLUGIN_PUBLIC_KEY }}
        run: python3 scripts/release.py metadata --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)"
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; inspect it instead of overwriting assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --target "$SOURCE_COMMIT" --draft --title "$RELEASE_TAG" --notes-file dist/release-notes.md
          gh release upload "$RELEASE_TAG" dist/*.zbplugin dist/SHA256SUMS dist/marketplace-entry.json
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/oauth-signing.key"
